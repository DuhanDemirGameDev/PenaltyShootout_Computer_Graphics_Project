<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penalty Shootout Simulator</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Orijinal tasarıma ek olarak UI elemanlarını canvas üzerine sabitleyen CSS katmanları */
    #gameWrapper {
      position: relative;
      display: inline-block;
    }

    #uiOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Tıklamaların arkadaki WebGL canvas'ına geçmesini sağlar */
      box-sizing: border-box;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Skor Tabelası */
    #scoreboard {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 25px;
      border-radius: 30px;
      border: 2px solid #4ade80;
      display: flex;
      gap: 30px;
      font-weight: bold;
      color: white;
    }
    .score-box { text-align: center; font-size: 14px; letter-spacing: 1px; }
    #goalScore { color: #4ade80; font-size: 24px; }
    #saveScore { color: #60a5fa; font-size: 24px; }

    /* Güç Barı */
    #powerContainer {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #555;
      display: none; /* Sadece şarj anında JavaScript ile açılacak */
    }
    #powerLabel { font-size: 11px; text-align: center; color: #aaa; margin-bottom: 4px; font-weight: bold; }
    #powerBorder { width: 100%; height: 16px; background: #222; border-radius: 4px; overflow: hidden; }
    #powerFill { width: 0%; height: 100%; background: linear-gradient(90deg, #4ade80, #facc15, #f87171); }

    /* Gol / Kurtarış Mesajı Pop-up */
    #gameMessage {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-size: 48px;
      font-weight: 900;
      text-shadow: 0 5px 15px rgba(0,0,0,0.8);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-transform: uppercase;
    }
    #gameMessage.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .msg-goal { color: #4ade80; }
    .msg-save { color: #60a5fa; }
    .msg-miss { color: #f87171; }

    /* Reset Bildirimi */
    #resetHint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #eee;
      display: none;
    }
  </style>
</head>
<body>

  <div id="gameWrapper">
    <canvas id="glCanvas" aria-label="Penalty Shootout Simulator WebGL canvas"></canvas>

    <div id="uiOverlay">
      <div id="scoreboard">
        <div class="score-box">GOAL<div id="goalScore">0</div></div>
        <div class="score-box">SAVE<div id="saveScore">0</div></div>
      </div>

      <div id="gameMessage">GOAL!</div>

      <div id="powerContainer">
        <div id="powerLabel">SHOT POWER</div>
        <div id="powerBorder">
          <div id="powerFill"></div>
        </div>
      </div>

      <div id="resetHint">PRESS <b>SPACE</b> FOR NEW SHOT</div>
    </div>
  </div>

  <aside id="uiPanel" class="ui-panel" aria-label="Simulation controls">
    <h1>Penalty Shootout Simulator</h1>

    <label for="goalkeeperX">
      Goalkeeper X
      <input id="goalkeeperX" type="range" min="-3" max="3" step="0.1" value="0">
    </label>

    <label for="lightIntensity">
      Spotlight Intensity
      <input id="lightIntensity" type="range" min="0" max="5" step="0.1" value="1.5">
    </label>
  </aside>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
