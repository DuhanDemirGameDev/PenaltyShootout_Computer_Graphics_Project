<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penalty Shootout Simulator</title>
  <meta name="description" content="A WebGL-powered penalty shootout simulator with real-time stadium lighting and physics.">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* ── Game overlay (canvas-positioned HUD) ── */
    #gameWrapper {
      position: relative;
      display: inline-block;
    }

    #uiOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      box-sizing: border-box;
      padding: 20px;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>

  <!-- ── WebGL Viewport ── -->
  <div id="gameWrapper">
    <canvas id="glCanvas" aria-label="Penalty Shootout Simulator WebGL canvas"></canvas>

    <!-- ── HUD Overlay ── -->
    <div id="uiOverlay">

      <!-- Scoreboard -->
      <div id="scoreboard">
        <div class="score-box">
          GOAL
          <div id="goalScore">0</div>
        </div>
        <div class="score-divider"></div>
        <div class="score-box">
          SAVE
          <div id="saveScore">0</div>
        </div>
      </div>

      <!-- Game result pop-up -->
      <div id="gameMessage">GOAL!</div>

      <!-- Shot power bar -->
      <div id="powerContainer">
        <div id="powerLabel">Shot Power</div>
        <div id="powerBorder">
          <div id="powerFill"></div>
        </div>
      </div>

      <!-- Reset hint -->
      <div id="resetHint">PRESS <b>SPACE</b> FOR NEW SHOT</div>

    </div><!-- /#uiOverlay -->
  </div><!-- /#gameWrapper -->


  <!-- ═══════════════════════════════════════════
       SIDE CONTROL PANEL
       ═══════════════════════════════════════════ -->
  <aside id="uiPanel" class="ui-panel" aria-label="Simulation controls">

    <h1>⚽ Penalty Shootout</h1>

    <!-- Goalkeeper position -->
    <label for="goalkeeperX">
      <div class="label-row">
        <span>Goalkeeper Position X</span>
        <span class="label-val" id="gkXVal">0.0</span>
      </div>
      <input id="goalkeeperX" type="range" min="-3" max="3" step="0.1" value="0"
             oninput="document.getElementById('gkXVal').textContent = parseFloat(this.value).toFixed(1)">
    </label>

    <hr class="panel-divider">

    <!-- Lighting controls -->
    <h3>🔆 Stadium Lighting</h3>

    <!-- Task 2: min=0, max=2, value=1.0 → thumb sits at exact centre -->
    <label for="lightIntensity">
      <div class="label-row">
        <span>Spotlight Intensity</span>
        <span class="label-val" id="intensityVal">1.0</span>
      </div>
      <input id="lightIntensity" type="range" min="0" max="2" step="0.05" value="1.0"
             oninput="document.getElementById('intensityVal').textContent = parseFloat(this.value).toFixed(2)">
    </label>

    <label for="lightMovementSpeed">
      <div class="label-row">
        <span>Spotlight Sweep Speed</span>
        <span class="label-val" id="sweepVal">1.0</span>
      </div>
      <input id="lightMovementSpeed" type="range" min="0" max="5" step="0.1" value="1.0"
             oninput="document.getElementById('sweepVal').textContent = parseFloat(this.value).toFixed(1)">
    </label>

    <hr class="panel-divider">
    <h3>📍 Light Tower Position</h3>

    <label for="selectedLightIndex" style="cursor:pointer;">
      <span>Select Tower</span>
      <select id="selectedLightIndex" class="panel-select">
        <option value="0">🔦 Tower 1 — Left Back</option>
        <option value="1">🔦 Tower 2 — Right Back</option>
        <option value="2" selected>🔦 Tower 3 — Left Front (Main)</option>
        <option value="3">🔦 Tower 4 — Right Front</option>
      </select>
    </label>

    <label for="lightPosX">
      <div class="label-row">
        <span>Position X</span>
        <span class="label-val" id="lightXVal">-9</span>
      </div>
      <input id="lightPosX" type="range" min="-15" max="15" step="0.2" value="-9"
             oninput="document.getElementById('lightXVal').textContent = parseFloat(this.value).toFixed(1)">
    </label>

    <label for="lightPosY">
      <div class="label-row">
        <span>Position Y (Height)</span>
        <span class="label-val" id="lightYVal">8</span>
      </div>
      <input id="lightPosY" type="range" min="3" max="22" step="0.2" value="8"
             oninput="document.getElementById('lightYVal').textContent = parseFloat(this.value).toFixed(1)">
    </label>

    <label for="lightPosZ">
      <div class="label-row">
        <span>Position Z (Depth)</span>
        <span class="label-val" id="lightZVal">7</span>
      </div>
      <input id="lightPosZ" type="range" min="-15" max="15" step="0.2" value="7"
             oninput="document.getElementById('lightZVal').textContent = parseFloat(this.value).toFixed(1)">
    </label>

    <hr class="panel-divider">
    <h3>💡 Active Towers</h3>

    <label class="toggle-label" for="light1Enabled">
      <input id="light1Enabled" type="checkbox" checked>
      <span class="toggle-pill"></span>
      <span class="tower-icon">🏟</span>
      Tower 1 — Left Back
    </label>

    <label class="toggle-label" for="light2Enabled">
      <input id="light2Enabled" type="checkbox" checked>
      <span class="toggle-pill"></span>
      <span class="tower-icon">🏟</span>
      Tower 2 — Right Back
    </label>

    <label class="toggle-label" for="light3Enabled">
      <input id="light3Enabled" type="checkbox" checked>
      <span class="toggle-pill"></span>
      <span class="tower-icon">🏟</span>
      Tower 3 — Left Front
    </label>

    <label class="toggle-label" for="light4Enabled">
      <input id="light4Enabled" type="checkbox" checked>
      <span class="toggle-pill"></span>
      <span class="tower-icon">🏟</span>
      Tower 4 — Right Front
    </label>

  </aside><!-- /#uiPanel -->

  <script type="module" src="./src/main.js"></script>

  <!-- Live-update slider fill tracks via CSS custom property -->
  <script>
    // Drive the CSS gradient fill on all range inputs using a --fill custom property
    function updateFill(input) {
      const min = parseFloat(input.min) || 0;
      const max = parseFloat(input.max) || 100;
      const val = parseFloat(input.value);
      const pct = ((val - min) / (max - min)) * 100;
      input.style.setProperty('--fill', pct + '%');
    }

    document.querySelectorAll('input[type="range"]').forEach(el => {
      updateFill(el);
      el.addEventListener('input', () => updateFill(el));
    });

    // Sync dropdown value badge labels on tower selection change
    const lightSelector = document.getElementById('selectedLightIndex');
    const xSlider = document.getElementById('lightPosX');
    const ySlider = document.getElementById('lightPosY');
    const zSlider = document.getElementById('lightPosZ');

    if (lightSelector) {
      lightSelector.addEventListener('change', () => {
        // Value badges update automatically when main.js sets .value + fires 'input'
        // Manually trigger fill updates after main.js sets slider values
        setTimeout(() => {
          [xSlider, ySlider, zSlider].forEach(s => {
            if (s) {
              updateFill(s);
              // Also refresh the badge text
              const badgeId = { lightPosX:'lightXVal', lightPosY:'lightYVal', lightPosZ:'lightZVal' }[s.id];
              const badge = badgeId && document.getElementById(badgeId);
              if (badge) badge.textContent = parseFloat(s.value).toFixed(1);
            }
          });
        }, 0);
      });
    }
  </script>
</body>
</html>
